name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    name: Structural checks (no toolchain required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Custom lint rules, budgets and dependency edges
        run: bash Tools/verify.sh

  build-and-test:
    name: Build, lint and test (Xcode)
    runs-on: macos-14
    env:
      SIMULATOR: iPhone 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: swiftlint --strict
        run: swiftlint --strict --config .swiftlint.yml

      - name: Build RouterKit for iOS
        working-directory: Packages/RouterKit
        run: xcodebuild -scheme RouterKit -destination 'generic/platform=iOS' build | tee "${GITHUB_WORKSPACE}/build.log"

      - name: Test RouterKit
        working-directory: Packages/RouterKit
        run: xcodebuild -scheme RouterKit -destination "platform=iOS Simulator,name=${SIMULATOR}" test

      # Appended to the same log so `swiftlint analyze` covers every package, not just
      # RouterKit and CoreKit. Building AppCore compiles all six.
      - name: Build AppCore for iOS
        working-directory: Packages/AppCore
        run: xcodebuild -scheme AppCore -destination 'generic/platform=iOS' build | tee -a "${GITHUB_WORKSPACE}/build.log"

      - name: Test FeatureSample
        working-directory: Packages/FeatureSample
        run: xcodebuild -scheme FeatureSample -destination "platform=iOS Simulator,name=${SIMULATOR}" test

      - name: Test AppCore
        working-directory: Packages/AppCore
        run: xcodebuild -scheme AppCore -destination "platform=iOS Simulator,name=${SIMULATOR}" test

      - name: swiftlint analyze --strict
        run: swiftlint analyze --strict --config .swiftlint.yml --compiler-log-path build.log

      # Proof that the infrastructure comes up on screen, not just that it compiles.
      - name: Build and launch the host app
        run: bash Tools/smoke-hostapp.sh

      - name: Upload the launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostapp-launch-screenshot
          path: hostapp-launch.png
          if-no-files-found: warn
